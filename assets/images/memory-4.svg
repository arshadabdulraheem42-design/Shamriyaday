<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="rainGrad" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#341b3c" />
      <stop offset="60%" stop-color="#1b0c22" />
      <stop offset="100%" stop-color="#0a030d" />
    </radialGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd599" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffd599" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#rainGrad)" />
  <!-- Rain streaks -->
  <g stroke="#e8607f" stroke-width="1.2" opacity="0.3" stroke-linecap="round">
    <line x1="80" y1="20" x2="60" y2="80"/><line x1="220" y1="70" x2="200" y2="130"/>
    <line x1="390" y1="30" x2="370" y2="90"/><line x1="580" y1="50" x2="560" y2="110"/>
    <line x1="720" y1="80" x2="700" y2="140"/><line x1="150" y1="200" x2="130" y2="260"/>
    <line x1="680" y1="250" x2="660" y2="310"/><line x1="280" y1="350" x2="260" y2="410"/>
  </g>
  <!-- Streetlamp glow -->
  <path d="M400 120 L300 450 L500 450 Z" fill="url(#warmLight)"/>
  <circle cx="400" cy="120" r="12" fill="#ffe2b0" />
  <!-- Umbrella -->
  <path d="M320 280 Q400 190 480 280 C440 280 430 275 400 275 C370 275 360 280 320 280 Z" fill="#e8607f" />
  <line x1="400" y1="230" x2="400" y2="360" stroke="#ffd599" stroke-width="3"/>
  <path d="M400 360 Q400 375 390 375" fill="none" stroke="#ffd599" stroke-width="3"/>
  <text x="400" y="520" font-family="'Cormorant Garamond', serif" font-size="24" fill="#ffd599" text-anchor="middle" font-style="italic">One small umbrella, zero worries</text>
</svg>
