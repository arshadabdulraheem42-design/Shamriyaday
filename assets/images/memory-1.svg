<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="skyGrad1" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#4e1b38" />
      <stop offset="50%" stop-color="#2a0a1e" />
      <stop offset="100%" stop-color="#14030f" />
    </radialGradient>
    <linearGradient id="glowG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9eb5" />
      <stop offset="50%" stop-color="#e8607f" />
      <stop offset="100%" stop-color="#e6b980" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#skyGrad1)" />
  <!-- Twinkling stars -->
  <g fill="#ffdca8" opacity="0.7">
    <circle cx="120" cy="80" r="1.5"/><circle cx="280" cy="140" r="2"/><circle cx="450" cy="60" r="1.2"/>
    <circle cx="680" cy="110" r="2.2"/><circle cx="720" cy="220" r="1.5"/><circle cx="200" cy="300" r="1.8"/>
  </g>
  <!-- Moon -->
  <path d="M600 100 A45 45 0 0 0 650 160 A40 40 0 1 1 600 100" fill="#ffe9c7" opacity="0.9"/>
  <!-- Gentle silhouette hills -->
  <path d="M0 480 Q200 420 400 460 T800 440 L800 600 L0 600 Z" fill="#1b0614" />
  <path d="M0 520 Q300 470 600 510 T800 500 L800 600 L0 600 Z" fill="#0d010a" />
  <!-- Romantic lantern / glowing hearts -->
  <g transform="translate(400, 340)">
    <circle cx="0" cy="0" r="60" fill="#e8607f" opacity="0.25" filter="blur(20px)"/>
    <path d="M0 20 C-18 6 -28 -5 -28 -16 A14 14 0 0 1 0 -8 A14 14 0 0 1 28 -16 C28 -5 18 6 0 20 Z" fill="url(#glowG)"/>
  </g>
  <text x="400" y="550" font-family="'Cormorant Garamond', serif" font-size="24" fill="#e6b980" text-anchor="middle" font-style="italic">Where our story began</text>
</svg>
