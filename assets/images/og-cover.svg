<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#4a1530" />
      <stop offset="50%" stop-color="#28081c" />
      <stop offset="100%" stop-color="#12020d" />
    </radialGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9eb5" />
      <stop offset="40%" stop-color="#e8607f" />
      <stop offset="100%" stop-color="#e6b980" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />

  <!-- Subtle star particles -->
  <circle cx="200" cy="120" r="2" fill="#ffd79a" opacity="0.6"/>
  <circle cx="340" cy="240" r="1.5" fill="#ffd79a" opacity="0.4"/>
  <circle cx="1020" cy="150" r="2.5" fill="#ffd79a" opacity="0.5"/>
  <circle cx="950" cy="380" r="1.5" fill="#ffd79a" opacity="0.4"/>
  <circle cx="150" cy="480" r="2" fill="#ffd79a" opacity="0.5"/>
  <circle cx="820" cy="510" r="1.8" fill="#ffd79a" opacity="0.45"/>

  <!-- Ornate Frame Border -->
  <rect x="40" y="40" width="1120" height="550" rx="20" fill="none" stroke="#e6b980" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="8 6"/>
  <rect x="55" y="55" width="1090" height="520" rx="14" fill="none" stroke="#e8607f" stroke-width="0.8" stroke-opacity="0.2"/>

  <!-- Pulsing Heart Center Motif -->
  <g transform="translate(600, 230) scale(1.6)" filter="url(#softGlow)">
    <path d="M0 26 C-24 8 -36 -6 -36 -20 A18 18 0 0 1 0 -10 A18 18 0 0 1 36 -20 C36 -6 24 8 0 26 Z" 
          fill="url(#roseGold)"/>
  </g>

  <!-- Script Typography -->
  <text x="600" y="360" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="400" fill="#e6b980" text-anchor="middle" letter-spacing="4">
    A Gift of Love for
  </text>
  <text x="600" y="450" font-family="'Great Vibes', cursive, 'Brush Script MT', serif" font-size="82" fill="#ffffff" text-anchor="middle">
    Ponnummaa
  </text>
  <text x="600" y="500" font-family="'Cormorant Garamond', Georgia, serif" font-size="22" font-weight="300" fill="#ffb4c4" text-anchor="middle" letter-spacing="8">
    SHAMRIYA SHERIN
  </text>
  <text x="600" y="540" font-family="'Cormorant Garamond', Georgia, serif" font-size="18" font-style="italic" fill="#e6b980" opacity="0.8" text-anchor="middle">
    A cinematic birthday story crafted with all my heart
  </text>
</svg>
