<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40142f" />
      <stop offset="50%" stop-color="#240c1d" />
      <stop offset="100%" stop-color="#11030d" />
    </linearGradient>
    <radialGradient id="sunGlow5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd599" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffd599" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#roadGrad)" />
  <!-- Mountain contours -->
  <polygon points="0,380 220,240 450,380" fill="#2d0c22"/>
  <polygon points="350,380 560,210 800,380" fill="#200718"/>
  <polygon points="180,380 380,280 620,380" fill="#36102a" opacity="0.8"/>
  <!-- Horizon glow -->
  <circle cx="400" cy="360" r="160" fill="url(#sunGlow5)" />
  <!-- Road perspective -->
  <polygon points="370,380 430,380 600,600 200,600" fill="#180412"/>
  <!-- Road dashed line -->
  <line x1="400" y1="380" x2="400" y2="600" stroke="#ffd599" stroke-width="4" stroke-dasharray="16 14"/>
  <text x="400" y="520" font-family="'Cormorant Garamond', serif" font-size="24" fill="#ffd599" text-anchor="middle" font-style="italic">Singing loudly along every mile</text>
</svg>
