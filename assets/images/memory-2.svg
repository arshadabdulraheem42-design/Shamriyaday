      <stop offset="60%" stop-color="#2d0d21" />
      <stop offset="100%" stop-color="#14030f" />
    </radialGradient>
    <linearGradient id="warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd599" />
